name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find the project (loose files, a subfolder, or any .zip)
        run: |
          echo "Files in the repository:"
          find . -path ./.git -prune -o -type f -print | head -60
          DIR=""
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1 || true)
          if [ -n "$S" ]; then DIR=$(dirname "$S"); fi
          if [ -z "$DIR" ]; then
            # use the zip that was committed most recently
            BEST=""; BT=0
            while IFS= read -r Z; do
              T=$(git log -1 --format=%ct -- "$Z" 2>/dev/null || echo 0)
              if [ -z "$T" ]; then T=0; fi
              if [ -z "$BEST" ] || [ "$T" -ge "$BT" ]; then BT=$T; BEST="$Z"; fi
            done < <(find . -iname "*.zip" -not -path "./.git/*")
            if [ -n "$BEST" ]; then
              echo "Unzipping newest zip: $BEST"
              mkdir -p work
              unzip -q -o "$BEST" -d work
              S=$(find work -name settings.gradle.kts | head -n 1 || true)
              if [ -n "$S" ]; then DIR=$(dirname "$S"); fi
            fi
          fi
          if [ -z "$DIR" ]; then
            echo "::error::No Gradle project found. Upload EndlessRoad.zip (a .zip file) to the repository root."
            exit 1
          fi
          echo "Using project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          APK=$(find "$PROJECT_DIR" -name "*.apk" -path "*release*" | head -n 1)
          cp "$APK" EndlessRoad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EndlessRoad-apk
          path: EndlessRoad.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" EndlessRoad.apk \
            --title "Endless Road build ${{ github.run_number }}" \
            --notes "Download EndlessRoad.apk and install it on your phone."
